# Databricks Asset Bundle: defines the whole lakehouse deployment as code.
bundle:
  name: retail_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by every layer
    default: retail_lakehouse
  alert_email:
    description: Email for job failure alerts (passed in from a GitHub secret)

targets:
  prod:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}