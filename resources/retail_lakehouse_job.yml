resources:
  jobs:
    retail_lakehouse_daily:
      name: retail_lakehouse_daily
      max_concurrent_runs: 1

      tags:
        project: retail_lakehouse
        managed_by: asset_bundle

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # every day at 06:00
        timezone_id: America/New_York
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - ${var.alert_email}

      parameters:
        - name: min_fact_rows
          default: "100000"
        - name: job_run_id
          default: "{{job.run_id}}"

      tasks:
        - task_key: simulate_new_data
          notebook_task:
            notebook_path: ../notebooks/09_simulate_orders_feed.ipynb

        - task_key: bronze_ingestion
          depends_on:
            - task_key: simulate_new_data
          max_retries: 1
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingestion.ipynb

        - task_key: silver_pipeline
          depends_on:
            - task_key: bronze_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.retail_silver_pipeline.id}
            full_refresh: false

        - task_key: gold_build
          depends_on:
            - task_key: silver_pipeline
          notebook_task:
            notebook_path: ../notebooks/04_gold_build.ipynb

        - task_key: governance
          depends_on:
            - task_key: gold_build
          notebook_task:
            notebook_path: ../notebooks/07_governance.ipynb

        - task_key: quality_gate
          depends_on:
            - task_key: gold_build
          notebook_task:
            notebook_path: ../notebooks/08_quality_gate.ipynb