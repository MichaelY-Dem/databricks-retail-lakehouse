resources:
  jobs:
    retail_lakehouse_daily:
      name: retail_lakehouse_daily
      schedule:
        quartz_cron_expression: 31 0 6 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: simulate_new_data
          notebook_task:
            notebook_path: /Workspace/Users/michael.yong.career@gmail.com/databricks-retail-lakehouse/notebooks/09_simulate_orders_feed
            source: WORKSPACE
        - task_key: bronze_ingestion
          depends_on:
            - task_key: simulate_new_data
          notebook_task:
            notebook_path: /Workspace/Users/michael.yong.career@gmail.com/databricks-retail-lakehouse/notebooks/01_bronze_ingestion
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
        - task_key: silver_pipeline
          depends_on:
            - task_key: bronze_ingestion
          pipeline_task:
            pipeline_id: 46ebe5c9-d598-4ca3-a65e-d5942478a2b7
        - task_key: gold_build
          depends_on:
            - task_key: silver_pipeline
          notebook_task:
            notebook_path: /Workspace/Users/michael.yong.career@gmail.com/databricks-retail-lakehouse/notebooks/04_gold_build
            source: WORKSPACE
        - task_key: governance
          depends_on:
            - task_key: gold_build
          notebook_task:
            notebook_path: /Workspace/Users/michael.yong.career@gmail.com/databricks-retail-lakehouse/notebooks/07_governance
            source: WORKSPACE
        - task_key: quality_gate
          depends_on:
            - task_key: gold_build
          notebook_task:
            notebook_path: /Workspace/Users/michael.yong.career@gmail.com/databricks-retail-lakehouse/notebooks/08_quality_gate
            source: WORKSPACE
      tags:
        project: retail_lakehouse
      queue:
        enabled: true
      parameters:
        - name: min_fact_rows
          default: "100000"
        - name: job_run_id
          default: "{{job.run_id}}"
      performance_target: PERFORMANCE_OPTIMIZED
